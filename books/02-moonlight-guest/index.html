<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>달빛 손님 루나와 토끼 몽이</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stage">
    <main id="book" class="book" aria-live="polite"></main>

    <button class="edge edge-left" id="edgePrev" aria-label="이전 페이지" tabindex="-1"></button>
    <button class="edge edge-right" id="edgeNext" aria-label="다음 페이지" tabindex="-1"></button>
  </div>

  <div class="progress"><div id="progressBar" class="progress-bar"></div></div>

  <nav class="controls" aria-label="페이지 이동">
    <button id="prev" class="ctrl-btn" aria-label="이전 페이지">
      <span aria-hidden="true">◀</span>
    </button>
    <span id="indicator" class="indicator">1 / 10</span>
    <button id="next" class="ctrl-btn" aria-label="다음 페이지">
      <span aria-hidden="true">▶</span>
    </button>
  </nav>

  <div id="dots" class="dots" role="tablist" aria-label="페이지 목록"></div>

  <a href="../../" class="back-to-library" aria-label="라이브러리로 돌아가기">← 도서관</a>

  <script src="book.js"></script>
</body>
</html>
