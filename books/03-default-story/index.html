<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2a2350">
  <title>꼬마 고슴도치 두리의 첫 밤마실</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stars" aria-hidden="true"></div>

  <header class="topbar">
    <div class="book-meta">
      <a href="../../" class="back-link" title="도서관으로">← 도서관</a>
      <span id="page-title" class="page-title">표지</span>
    </div>
    <div class="top-actions">
      <button id="toc-btn" class="ghost-btn" title="목차" aria-label="목차 열기">☰ 목차</button>
      <button id="theme-btn" class="ghost-btn" title="테마 전환" aria-label="밝게/어둡게 전환">🌙</button>
      <button id="restart-btn" class="ghost-btn" title="처음부터" aria-label="처음부터 보기">⟲</button>
    </div>
  </header>

  <main id="book" class="book" tabindex="0" aria-label="동화책 본문">
    <div class="page-track" id="page-track"></div>
    <button class="edge-nav left" id="edge-prev" aria-label="이전 페이지" tabindex="-1"></button>
    <button class="edge-nav right" id="edge-next" aria-label="다음 페이지" tabindex="-1"></button>
  </main>

  <nav class="controls" aria-label="페이지 컨트롤">
    <button id="prev" class="nav-btn" aria-label="이전 페이지">◀ 이전</button>
    <div class="indicator-wrap">
      <span id="indicator" class="indicator">1 / 10</span>
      <div id="progress" class="progress" role="progressbar" aria-label="읽기 진행률">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
    </div>
    <button id="next" class="nav-btn" aria-label="다음 페이지">다음 ▶</button>
  </nav>

  <aside id="toc-panel" class="toc-panel" aria-hidden="true">
    <div class="toc-header">
      <span>목차</span>
      <button id="toc-close" class="ghost-btn small" aria-label="목차 닫기">✕</button>
    </div>
    <ol id="toc-list" class="toc-list"></ol>
  </aside>
  <div id="toc-overlay" class="toc-overlay" aria-hidden="true"></div>

  <!-- file:// 로 더블클릭해 열 때 fetch 가 막히므로 인라인 데이터 폴백 제공 -->
  <script src="book.data.js"></script>
  <script src="book.js"></script>
</body>
</html>
